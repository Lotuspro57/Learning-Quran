name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html sw.js manifest.webmanifest version.json icons www/
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          CFG="<script>window.ARABI_CONFIG={versionUrl:'https://$OWNER.github.io/$REPO/version.json',apkUrl:'https://github.com/$GITHUB_REPOSITORY/releases/latest'};</script>"
          sed -i "s|<style>html{color-scheme|$CFG<style>html{color-scheme|" www/index.html
          grep -c ARABI_CONFIG www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c TTS_SERVICE android/app/src/main/AndroidManifest.xml

      - name: Set version
        run: |
          V=$(node -p "require('./version.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Use fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: App icon
        run: |
          cp -r android-res/. android/app/src/main/res/
          ls android/app/src/main/res/mipmap-xxxhdpi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arabi-shikhi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arabi-shikhi-apk
          path: arabi-shikhi.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(node -p "require('./version.json').notes.map(n=>'- '+n).join('\n')")
          gh release delete "v$VERSION" --cleanup-tag -y || true
          gh release create "v$VERSION" arabi-shikhi.apk --title "আরবি শিখি v$VERSION" --notes "$NOTES" --latest
